# Azeroth Exchange website for the Docker container (docker-compose.yml mounts the folders below).
# Same rules as nginx/azeroth-exchange.conf.template; keep the two in sync.

server {
    listen 80;
    server_name _;

    root /srv/dist;
    index index.html;
    charset utf-8;

    # No visitor logs (see privacy.html). Errors are still logged by nginx.
    access_log off;

    # Never serve dotfiles, including the back end's in-progress temp files.
    location ~ /\. {
        deny all;
    }

    # The built site. Hashed build assets never change; everything else is checked hourly.
    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }
    # Pages: "no-transform" stops Cloudflare from injecting its analytics beacon (we promise no tracking).
    location = /index.html {
        add_header Cache-Control "no-cache, no-transform";
    }
    location ~ \.html$ {
        add_header Cache-Control "no-cache, no-transform";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Game data and realm lists. Uses the pre-compressed .gz copies when they exist.
    location /json/realms/ {
        alias /srv/realms/;
        add_header Cache-Control "no-cache";
    }
    location /json/ {
        alias /srv/json/;
        gzip_static on;
        add_header Cache-Control "no-cache";
    }

    # Price data from the back end. Every file is stored gzipped, so label it as such and let the browser
    # inflate it. Last-Modified (sent by default) is how the site detects new snapshots.
    location /data/cached/ {
        alias /srv/data/;
        default_type application/octet-stream;
        types {}
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=300";
    }
    location /data/ {
        alias /srv/data/;
        default_type application/octet-stream;
        types {}
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache";
    }
}
